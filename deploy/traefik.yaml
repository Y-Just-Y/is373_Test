global:
  checkNewVersion: false
  sendAnonymousUsage: false
entryPoints:
  web:
    address: ":8080"
    http:
      redirections:
        entryPoint:
          to: ":443"
          scheme: https
          permanent: true
  websecure:
    address: ":8443"
    http:
      tls:
        options: default@file
  ping:
    address: ":8082"
ping:
  entryPoint: ping
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: "ACME_EMAIL_REPLACED_BY_BOOTSTRAP"
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
log:
  level: INFO
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
